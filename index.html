<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="SHParro: área personal para herramientas web geoespaciales y utilidades.">
  <title>SHParro — Herramientas geoespaciales</title>
  <link rel="stylesheet" href="./css/shparro.css?v=20261108">
</head>
<body>
  <div class="app-shell">
    <main class="main">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="Inicio de SHParro">
          <span class="brand-mark">SH</span><strong>SHParro</strong>
        </a>
        <nav class="menubar" aria-label="Menú principal">
          <div class="menu" data-menu="file">
            <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Archivo</button>
            <div class="menu-panel file-menu" role="menu">
              <button type="button" role="menuitem" disabled>Abrir archivo… <kbd>Ctrl O</kbd></button>
              <button type="button" role="menuitem" disabled>Abrir proyecto…</button>
              <div class="menu-separator" role="separator"></div>
              <button type="button" role="menuitem" disabled>Guardar <kbd>Ctrl S</kbd></button>
              <button type="button" role="menuitem" disabled>Guardar como…</button>
            </div>
          </div>
          <div class="menu" data-menu="tools">
            <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Herramientas</button>
            <div class="menu-panel tools-menu" role="menu">
              <div class="menu-heading">Herramientas</div>
              <div id="toolsMenuItems"></div>
            </div>
          </div>
        </nav>
        <label class="search-box" for="toolSearch">
          <span aria-hidden="true">⌕</span>
          <input id="toolSearch" type="search" placeholder="Buscar herramientas..." autocomplete="off">
        </label>
        <div class="topbar-actions">
          <span class="connection-pill" id="connectionPill"><span></span> Online</span>
        </div>
      </header>

      <section class="content-view" id="homeView">
        <div class="welcome-screen">
          <div class="home-logo" aria-hidden="true">SH</div>
          <span class="eyebrow">Área personal</span>
          <h1>Explora el territorio<br><em>con precisión.</em></h1>
          <p>Un espacio para transformar coordenadas, consultar relieve y trabajar con información geoespacial.</p>
          <button class="welcome-action" id="openToolsButton" type="button">Explorar herramientas <span aria-hidden="true">→</span></button>
          <div class="welcome-hint">También puedes usar el menú superior.</div>
        </div>
      </section>

      <section class="content-view hidden" id="toolView">
        <iframe id="toolFrame" title="Herramienta SHParro" allow="geolocation"></iframe>
      </section>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="./js/shparro.js?v=20261108"></script>
</body>
</html>
