<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18181b">
  <meta name="description" content="SHParro: área personal para herramientas web geoespaciales y utilidades.">
  <title>SHParro</title>
  <link rel="stylesheet" href="./css/shparro.css?v=20261108">
</head>
<body>
  <div class="app-shell">
    <main class="main">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Inicio de SHParro">
          <span class="brand-mark">S</span><strong>SHParro</strong>
        </a>
        <nav class="primary-nav" aria-label="Secciones">
          <button class="nav-item active" data-view="home" type="button">Herramientas</button>
          <button class="nav-item" data-view="favorites" type="button">Favoritos</button>
        </nav>
        <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="Abrir menú">☰</button>
        <label class="search-box" for="toolSearch">
          <span aria-hidden="true">⌕</span>
          <input id="toolSearch" type="search" placeholder="Buscar herramientas..." autocomplete="off">
          <kbd>Ctrl K</kbd>
        </label>
        <div class="topbar-actions">
          <a class="icon-button" id="docsLink" href="./docs/integration.html" title="Documentación">?</a>
          <span class="connection-pill" id="connectionPill"><span></span> Online</span>
        </div>
      </header>

      <section class="content-view" id="homeView">
        <div class="workspace-heading">
          <div>
            <span class="eyebrow">Área personal</span>
            <h1>Herramientas</h1>
            <p id="toolsSummary">Reuniendo interfaces y utilidades en un solo espacio.</p>
          </div>
          <button class="button secondary" id="reloadTools" type="button">Actualizar</button>
        </div>

        <div id="toolGroups"></div>
      </section>

      <section class="content-view hidden" id="toolView">
        <iframe id="toolFrame" title="Herramienta SHParro"></iframe>
      </section>
    </main>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="./js/shparro.js?v=20261108"></script>
</body>
</html>
